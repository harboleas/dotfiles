# ==========================================
#  OPCIONES GENERALES
# ==========================================
# Soporte de colores reales (True Color)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Activar el uso del mouse (clic para cambiar paneles, arrastrar para redimensionar)
set -g mouse on

# Numeración de ventanas y paneles comenzando en 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
#  ATAJOS DE TECLADO COMPLETAMENTE NATIVOS
# ==========================================
# Cambiar el prefijo predeterminado a Ctrl + a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Dividir la pantalla de manera intuitiva con | y -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Moverse entre paneles con las teclas h, j, k, l (estilo Vim)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recargar este archivo de configuración con Prefijo + r
bind r source-file ~/.tmux.conf \; display "¡Configuración nativa recargada!"

# ==========================================
#  DISEÑO PERSONALIZADO (Estilo Catppuccin Mocha Puro)
# ==========================================
# Paleta de colores Catppuccin Mocha
# Fondo: #1e1e2e | Texto: #cdd6f4 | Activo: #cba6f7 | Gris oscuro: #313244

# Configuración general de la barra de estado
set -g status "on"
set -g status-bg "#1e1e2e"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Bordes de los paneles (Panes)
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#6c7086"

# Estilo de los mensajes internos
set -g message-style "fg=#cdd6f4,bg=#313244,bold"

# ---- DISEÑO DE LA BARRA INFERIOR ----

# Lado izquierdo (Muestra el nombre de la sesión)
set -g status-left "#[fg=#11111b,bg=#cba6f7,bold]    #S #[fg=#cba6f7,bg=#1e1e2e] "

# Lado derecho (Muestra la ruta actual y un reloj simple)
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244]  #{b:pane_current_path} #[fg=#89b4fa,bg=#313244] #[fg=#11111b,bg=#89b4fa,bold]  %H:%M "

# Ventanas inactivas en la barra
setw -g window-status-format "#[fg=#cdd6f4,bg=#1e1e2e]  #I:#W  "

# Ventana actualmente activa
setw -g window-status-current-format "#[fg=#a6e3a1,bg=#1e1e2e]#[fg=#11111b,bg=#a6e3a1,bold]#I:#W#[fg=#a6e3a1,bg=#1e1e2e]"
